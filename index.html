<style>
html, body, #root { height: 100%; }

body {
  background: #05070d;
  color: #e6ecf7;
  font-family: 'Lato', system-ui, sans-serif;
  overflow-x: hidden;
}

/* Nebula backdrop with faint starfield */
.nebula-bg {
  background:
    radial-gradient(ellipse 42% 30% at 84% 16%, rgba(59,130,246,0.10), transparent 70%),
    radial-gradient(ellipse 55% 38% at 96% 42%, rgba(37,99,235,0.08), transparent 70%),
    radial-gradient(ellipse 30% 55% at 70% 0%, rgba(96,165,250,0.05), transparent 75%),
    linear-gradient(180deg, #060910 0%, #05070d 55%, #04060b 100%);
}

.card {
  background: linear-gradient(180deg, rgba(15, 23, 42, 0.45), rgba(9, 14, 25, 0.85));
  border: 1px solid rgba(148, 163, 184, 0.10);
  border-radius: 16px;
}

.accent-btn {
  background: linear-gradient(90deg, rgba(37, 99, 235, 0.35), rgba(59, 130, 246, 0.18));
  border: 1px solid rgba(96, 165, 250, 0.45);
  box-shadow: 0 0 22px rgba(59, 130, 246, 0.22);
}
.accent-btn:hover { border-color: rgba(147, 197, 253, 0.7); }

.thin-track { height: 4px; border-radius: 2px; background: rgba(51, 65, 85, 0.55); overflow: hidden; }
.thin-fill { height: 100%; border-radius: 2px; background: linear-gradient(90deg, #2563eb, #60a5fa); }

.custom-scrollbar::-webkit-scrollbar { width: 3px; height: 3px; }
.custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
.custom-scrollbar::-webkit-scrollbar-thumb { background: rgba(148, 163, 184, 0.25); border-radius: 3px; }
.custom-scrollbar::-webkit-scrollbar-thumb:hover { background: rgba(148, 163, 184, 0.5); }

/* ---------- rich-text note editor ---------- */
.note-body:empty:before{ content: attr(data-placeholder); color: #5b6a87; }
.note-body ul{ list-style: disc; padding-left: 1.4em; margin: 0.3em 0; }
.note-body ol{ list-style: decimal; padding-left: 1.6em; margin: 0.3em 0; }
.note-body li{ margin: 0.15em 0; }
.note-body a{ color: #60a5fa; text-decoration: underline; }
/* nested outline: 1. -> a. -> i. -> repeat */
.note-body ol.note-outline{ list-style-type: decimal; }
.note-body ol.note-outline ol{ list-style-type: lower-alpha; }
.note-body ol.note-outline ol ol{ list-style-type: lower-roman; }
.note-body ol.note-outline ol ol ol{ list-style-type: decimal; }
/* read-only rendering in cards reuses the same */
.note-render ul{ list-style: disc; padding-left: 1.4em; }
.note-render ol{ list-style: decimal; padding-left: 1.6em; }

@keyframes qtShimmer { 0% { transform: translateX(-100%); } 60%, 100% { transform: translateX(100%); } }
</style>
